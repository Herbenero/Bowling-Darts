<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bowling Darts</title>
  <style>
    :root {
      --bg: #121820;
      --panel: #1e2632;
      --accent: #2563eb;
      --gold: #f59e0b;
      --line: #334155;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }

    .controls, .player-setup {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    input, select, button {
      background: #0f172a;
      border: 1px solid var(--line);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 1rem;
    }

    button {
      cursor: pointer;
      background: var(--accent);
      border: none;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: #475569;
    }

    .board-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.9rem;
    }

    th, td {
      border: 1px solid var(--line);
      padding: 8px 4px;
    }

    th {
      background: #0f172a;
    }

    .active-player {
      background: rgba(37, 99, 235, 0.2);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .keypad button {
      padding: 12px 4px;
      background: #1e293b;
      border: 1px solid var(--line);
    }

    .message {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--gold);
      min-height: 1.5em;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      text-align: center;
    }

    .standings-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 20px 0;
    }

    .standing-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      border: 1px solid var(--line);
    }

    .standing-card.first {
      border-color: var(--gold);
      background: rgba(245, 158, 11, 0.1);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎯 Bowling Darts</h1>

    <div class="panel player-setup">
      <div id="playerInputs"></div>
      <button id="addPlayer">+ Add Player</button>
      <button id="removePlayer" class="btn-secondary">- Remove</button>
      <select id="boardSelector">
        <option value="standard">Standard Board</option>
        <option value="quad">Quad Board (4x)</option>
      </select>
      <button id="startGame">Start Game</button>
    </div>

    <div class="panel">
      <div class="message" id="message">Configure players and press Start Game!</div>
      <div id="meta" style="margin-top: 6px; color: var(--subtext);"></div>
    </div>

    <div class="panel board-container">
      <table id="scoreboard">
        <thead>
          <tr id="headerRow"></tr>
        </thead>
        <tbody id="boardBody"></tbody>
      </table>
    </div>

    <div class="panel">
      <div class="keypad" id="shotButtons"></div>
      <div style="margin-top: 12px; display: flex; gap: 8px;">
        <button id="endTurnBtn" style="flex: 2;">End Turn</button>
        <button id="undoBtn" class="btn-secondary" style="flex: 1;">Undo</button>
        <button id="resetBtn" class="btn-secondary" style="flex: 1;">Reset</button>
      </div>
    </div>
  </div>

  <!-- Final Scoreboard Modal -->
  <div id="finalModal" class="modal-overlay">
    <div class="panel modal-content">
      <h2 style="margin-top: 0; color: var(--gold);">🏆 Game Over 🏆</h2>
      <div id="winnerText" style="font-size: 1.3rem; font-weight: 800;"></div>
      <div id="finalStandings" class="standings-list"></div>
      <button onclick="document.getElementById('finalModal').style.display='none'" style="width: 100%;">Close & View Scorecard</button>
    </div>
  </div>

  <script>
    let players = [];
    let currentPlayer = 0;
    let frameIndex = 0;
    let dart = 1;
    let started = false;
    let gameOver = false;
    let boardType = 'standard';
    let historyStack = [];

    const els = {
      playerInputs: document.getElementById('playerInputs'),
      addPlayer: document.getElementById('addPlayer'),
      removePlayer: document.getElementById('removePlayer'),
      boardSelector: document.getElementById('boardSelector'),
      startGame: document.getElementById('startGame'),
      message: document.getElementById('message'),
      meta: document.getElementById('meta'),
      headerRow: document.getElementById('headerRow'),
      boardBody: document.getElementById('boardBody'),
      shotButtons: document.getElementById('shotButtons'),
      endTurnBtn: document.getElementById('endTurnBtn'),
      undoBtn: document.getElementById('undoBtn'),
      resetBtn: document.getElementById('resetBtn'),
      finalModal: document.getElementById('finalModal'),
      winnerText: document.getElementById('winnerText'),
      finalStandings: document.getElementById('finalStandings')
    };

    function createPlayer(name) {
      return {
        name: name,
        frames: Array.from({ length: 10 }, () => ({
          lane: null, d1: null, d2: null, d3: null, v2: 0, v3: 0, total: 0, result: '', turnComplete: false
        })),
        totalScore: 0
      };
    }

    function renderPlayersInputs() {
      els.playerInputs.innerHTML = players.map((p, i) => 
        `<input type="text" value="${escapeHtml(p.name)}" onchange="players[${i}].name = this.value" placeholder="Player ${i+1}">`
      ).join('');
    }

    function buildKeypad() {
      const shots = ['S', 'D', 'T', 'DB', 'SB', '0'];
      if (boardType === 'quad') shots.splice(3, 0, 'Q');
      
      els.shotButtons.innerHTML = shots.map(s => 
        `<button data-shot="${s}">${s}</button>`
      ).join('');
    }

    function renderShotButtons() {
      buildKeypad();
    }

    function updateMeta() {
      if (!started || gameOver) {
        els.meta.textContent = '';
        return;
      }
      const p = players[currentPlayer];
      els.meta.textContent = `Current Turn: ${p.name} | Frame: ${frameIndex + 1}/10 | Dart: ${dart}/3`;
    }

    function setMessage(msg) {
      els.message.textContent = msg;
    }

    function renderBoard() {
      let headHtml = '<th>Player</th>';
      for (let i = 1; i <= 10; i++) headHtml += `<th>F${i}</th>`;
      headHtml += '<th>Total</th>';
      els.headerRow.innerHTML = headHtml;

      els.boardBody.innerHTML = players.map((p, pIdx) => {
        const isActive = started && !gameOver && pIdx === currentPlayer;
        let row = `<tr class="${isActive ? 'active-player' : ''}"><td><strong>${escapeHtml(p.name)}</strong></td>`;
        
        p.frames.forEach(f => {
          let cellStr = f.result || '-';
          row += `<td>${cellStr}</td>`;
        });

        row += `<td><strong>${p.totalScore}</strong></td></tr>`;
        return row;
      }).join('');
    }

    function saveState() {
      historyStack.push(JSON.stringify({
        players, currentPlayer, frameIndex, dart, started, gameOver
      }));
    }

    function undo() {
      if (!historyStack.length) return;
      const state = JSON.parse(historyStack.pop());
      players = state.players;
      currentPlayer = state.currentPlayer;
      frameIndex = state.frameIndex;
      dart = state.dart;
      started = state.started;
      gameOver = state.gameOver;
      renderBoard();
      updateMeta();
      setMessage('Last action undone.');
    }

    function applyThrow(shot) {
      if (!started || gameOver) return;
      saveState();

      const p = players[currentPlayer];
      const f = p.frames[frameIndex];

      if (dart === 1) {
        f.d1 = shot;
        if (shot === 'D') {
          f.result = 'X';
          f.total = 30;
          f.turnComplete = true;
        } else {
          f.lane = shot;
          f.result = `${shot} | - | -`;
        }
      } else if (dart === 2) {
        f.d2 = shot;
        f.v2 = calculatePoints(shot);
        f.result = `${f.lane} | ${shot} | -`;
      } else if (dart === 3) {
        f.d3 = shot;
        f.v3 = calculatePoints(shot);
        f.total = f.v2 + f.v3;
        f.result = `${f.lane} | ${f.d2} | ${f.d3} (${f.total})`;
        f.turnComplete = true;
      }

      calculateTotals();
      renderBoard();

      if (f.turnComplete) {
        endTurn();
      } else {
        dart++;
        updateMeta();
      }
    }

    function calculatePoints(shot) {
      switch (shot) {
        case 'S': return 1;
        case 'D': return 2;
        case 'T': return 3;
        case 'Q': return 4;
        case 'DB': return 5;
        case 'SB': return 2;
        default: return 0;
      }
    }

    function calculateTotals() {
      players.forEach(p => {
        p.totalScore = p.frames.reduce((sum, f) => sum + (f.total || 0), 0);
      });
    }

    function endTurn() {
      if (!started || gameOver) return;

      const p = players[currentPlayer];
      p.frames[frameIndex].turnComplete = true;

      if (currentPlayer < players.length - 1) {
        currentPlayer++;
        dart = 1;
      } else {
        currentPlayer = 0;
        dart = 1;
        frameIndex++;
      }

      if (checkGameOver()) {
        gameOver = true;
        showFinalScoreboard();
      } else {
        setMessage(`Turn ended. ${players[currentPlayer].name}'s turn.`);
      }

      updateMeta();
      renderBoard();
    }

    function checkGameOver() {
      return frameIndex >= 10;
    }

    function showFinalScoreboard() {
      const sortedPlayers = [...players].sort((a, b) => b.totalScore - a.totalScore);
      const winner = sortedPlayers[0];

      els.winnerText.textContent = `Winner: ${winner.name} (${winner.totalScore} pts)`;

      els.finalStandings.innerHTML = sortedPlayers.map((p, rank) => `
        <div class="standing-card ${rank === 0 ? 'first' : ''}">
          <span style="font-weight: 800;">#${rank + 1} ${escapeHtml(p.name)}</span>
          <span style="font-weight: 900; color: var(--gold);">${p.totalScore} pts</span>
        </div>
      `).join('');

      setMessage(`GAME OVER! Winner: ${winner.name} with ${winner.totalScore} pts!`);
      els.finalModal.style.display = 'flex';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    // Event Listeners
    els.addPlayer.addEventListener('click', () => {
      players.push(createPlayer('Player ' + (players.length + 1)));
      renderPlayersInputs();
      renderBoard();
    });

    els.removePlayer.addEventListener('click', () => {
      if (players.length > 1) {
        players.pop();
        renderPlayersInputs();
        renderBoard();
      }
    });

    els.boardSelector.addEventListener('change', e => {
      boardType = e.target.value;
      renderShotButtons();
      updateMeta();
    });

    els.startGame.addEventListener('click', () => {
      if (!players.length) return;
      boardType = els.boardSelector.value;
      started = true;
      gameOver = false;
      currentPlayer = 0;
      frameIndex = 0;
      dart = 1;
      players.forEach(p => {
        p.frames = Array.from({ length: 10 }, () => ({
          lane: null, d1: null, d2: null, d3: null, v2: 0, v3: 0, total: 0, result: '', turnComplete: false
        }));
        p.totalScore = 0;
      });
      setMessage('Game started! Throw Dart 1 to pick a lane.');
      renderBoard();
      updateMeta();
    });

    els.shotButtons.addEventListener('click', e => {
      const btn = e.target.closest('[data-shot]');
      if (!btn) return;
      applyThrow(btn.dataset.shot);
    });

    els.endTurnBtn.addEventListener('click', endTurn);
    els.undoBtn.addEventListener('click', undo);
    els.resetBtn.addEventListener('click', () => {
      started = false;
      gameOver = false;
      renderBoard();
      updateMeta();
      setMessage('Game reset.');
    });

    // Initial setup
    players = [createPlayer('Alice'), createPlayer('Bob')];
    renderPlayersInputs();
    renderShotButtons();
    renderBoard();
    updateMeta();
  </script>
</body>
</html>
